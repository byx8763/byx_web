<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>員工體檢管理</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js" defer></script><script src="app.js" defer></script></head>
<body><main class="shell"><header><div><p class="eyebrow">STAFF HEALTH MANAGER</p><h1>員工體檢管理</h1><p class="muted">掌握員工資料與體檢期限</p></div><button id="logout" class="secondary" hidden>登出</button></header>
<div id="notice" role="status" aria-live="polite"></div>
<section id="login" class="card login"><h2>管理員登入</h2><p class="muted">請使用管理員帳號登入。</p><form id="loginForm"><label>電子郵件<input id="email" type="email" required autocomplete="username"></label><label>密碼<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">登入</button></form></section>
<section id="dashboard" hidden><div class="summary"><article class="metric"><span>員工總數</span><strong id="total">0</strong></article><article class="metric warning"><span>30 天內到期</span><strong id="soon">0</strong></article><article class="metric danger"><span>已到期</span><strong id="overdue">0</strong></article></div><section class="card"><div class="section-head"><div><h2>員工名單</h2><p class="muted">依目前年齡推估到期日，每年 1 月 1 日自動加一歲。</p></div><button id="add">新增員工</button></div><div class="filters"><input id="search" type="search" placeholder="搜尋姓名或員工編號" aria-label="搜尋姓名或員工編號"><label class="check"><input type="checkbox" id="onlyDue">只顯示已到期或 30 天內到期</label></div><div class="table-wrap"><table><thead><tr><th>員工</th><th>年齡</th><th>勞工體檢</th><th>供膳體檢</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty" hidden>目前沒有符合條件的員工。</p></section></section></main>
<dialog id="editor"><form id="employeeForm"><div class="section-head"><h2 id="formTitle">新增員工</h2><button type="button" id="close" class="icon" aria-label="關閉">×</button></div><input id="recordId" type="hidden"><label>姓名<input name="name" required maxlength="100"></label><label>員工編號<input name="employee_number" required maxlength="100"></label><label>目前年齡<input name="age" type="number" required min="0" max="120"></label><p class="hint">輸入今年年齡，之後每年 1 月 1 日自動加一歲。</p><label>勞工體檢日期<input name="labor_exam_date" type="date"></label><label>供膳體檢日期<input name="food_exam_date" type="date"></label><div class="actions"><button type="button" id="cancel" class="secondary">取消</button><button type="submit">儲存</button></div></form></dialog></body></html>
