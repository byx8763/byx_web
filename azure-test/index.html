<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>管理系統</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5.30.0/lib/msal-browser.min.js" defer></script><script src="azure-config.js" defer></script><script src="app.js?v=pms1" defer></script></head>
<body><div class="app-layout"><aside id="sidebar" class="sidebar" hidden><div class="brand">▦ <span>管理平台</span></div><nav aria-label="功能選單"><button class="nav-item active" data-page="home">⌂　主畫面</button><button class="nav-item" disabled hidden>⇧　資料匯入 <small>規劃中</small></button><button class="nav-item" disabled hidden>▤　資料表檢視 <small>規劃中</small></button><button class="nav-item" disabled hidden>▥　銷售營業額 <small>規劃中</small></button><button class="nav-item" disabled hidden>◇　產品銷售數量 <small>規劃中</small></button><button class="nav-item" disabled hidden>▱　銷售組合 <small>規劃中</small></button><button class="nav-item" disabled hidden>□　原物料明細 <small>規劃中</small></button><button class="nav-item" disabled hidden>⚑　新品與促銷 <small>規劃中</small></button><button class="nav-item" data-page="health">♡　員工體檢</button><button class="nav-item" data-page="coupons">▣　優惠券查詢</button><button class="nav-item" data-page="pms">▥　多店營運比較</button><button class="nav-item" disabled hidden>⚙　設定 <small>規劃中</small></button></nav></aside><main class="shell"><header><div><p class="eyebrow">OPERATIONS CENTER</p><h1 id="pageTitle">員工體檢管理</h1><p class="muted" id="pageSubtitle">掌握員工資料與體檢期限</p></div><button id="logout" class="secondary" hidden>登出</button></header>
<div id="notice" role="status" aria-live="polite"></div>
<section id="homePage" hidden><div class="welcome"><h2>您好，歡迎使用營運資料中心</h2><p class="muted">掌握員工體檢提醒，快速前往常用功能。</p></div><section class="card"><div class="section-head"><div><h2>♡　體檢提醒</h2><p class="muted">已到期及 30 天內到期的員工體檢</p></div><button class="secondary" data-go="health">查看員工體檢</button></div><div id="homeReminders" class="reminders"></div></section><section class="card shortcuts"><h2>功能入口</h2><div class="shortcut-grid"><button class="shortcut" data-go="health"><strong>♡　員工體檢</strong><span>管理員工資料與體檢期限</span></button><button class="shortcut" data-go="coupons"><strong>▣　優惠券查詢</strong><span>搜尋優惠券與餐點內容</span></button><button class="shortcut" data-go="pms"><strong>▥　多店營運比較</strong><span>查看公司電腦同步的門市營運資料</span></button></div></section></section>
<section id="pmsPage" hidden><iframe id="pmsFrame" title="多店營運比較看板" style="width:100%;height:1600px;border:0;border-radius:12px;background:#0a1220"></iframe></section>
<section id="couponPage" hidden><section class="card"><div class="section-head"><div><h2>優惠券查詢</h2><p id="couponUpdated" class="muted">尚無更新資料</p></div><button id="couponRefresh" class="secondary">手動更新</button></div><p id="couponNotice" class="hint" role="status"></p><label>搜尋優惠券代碼、名稱或餐點<input id="couponSearch" type="search" placeholder="輸入關鍵字"></label><div class="coupon-filters"><label>必須包含的產品<input id="couponInclude" placeholder="以逗號分隔多個產品"></label><label>排除的產品<input id="couponExclude" placeholder="以逗號分隔多個產品"></label><label>有效狀態<select id="couponValidity"><option value="all">全部</option><option value="valid">有效</option><option value="invalid">非有效</option></select></label><label>排序<select id="couponSort"><option value="price">價格由低到高</option><option value="priceDesc">價格由高到低</option><option value="date">到期日由近到遠</option><option value="code">代碼</option></select></label></div><p id="couponCount" class="muted"></p><div id="couponResults"></div></section></section>
<section id="login" class="card login"><h2>管理員登入</h2><p class="muted">前往安全登入頁面，使用你的管理系統帳號和密碼。</p><form id="loginForm"><button type="submit">登入</button></form></section>
<section id="dashboard" hidden><div class="summary"><article class="metric"><span>員工總數</span><strong id="total">0</strong></article><article class="metric warning"><span>30 天內到期</span><strong id="soon">0</strong></article><article class="metric danger"><span>已到期</span><strong id="overdue">0</strong></article></div><section class="card"><div class="section-head"><div><h2>員工名單</h2><p class="muted">依目前年齡推估到期日，每年 1 月 1 日自動加一歲。</p></div><button id="add">新增員工</button></div><div class="filters"><input id="search" type="search" placeholder="搜尋姓名或員工編號" aria-label="搜尋姓名或員工編號"><label class="check"><input type="checkbox" id="onlyDue">只顯示已到期或 30 天內到期</label></div><div class="table-wrap"><table><thead><tr><th>員工</th><th>年齡</th><th>勞工體檢</th><th>供膳體檢</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="empty" hidden>目前沒有符合條件的員工。</p></section></section>
<dialog id="editor"><form id="employeeForm"><div class="section-head"><h2 id="formTitle">新增員工</h2><button type="button" id="close" class="icon" aria-label="關閉">×</button></div><input id="recordId" type="hidden"><label>姓名<input name="name" required maxlength="100"></label><label>員工編號<input name="employee_number" required maxlength="100"></label><label>目前年齡<input name="age" type="number" required min="0" max="120"></label><p class="hint">輸入今年年齡，之後每年 1 月 1 日自動加一歲。</p><label>勞工體檢日期<input name="labor_exam_date" type="date"></label><label>供膳體檢日期<input name="food_exam_date" type="date"></label><div class="actions"><button type="button" id="cancel" class="secondary">取消</button><button type="submit">儲存</button></div></form></dialog></main></div><script src="coupons/coupons.js" defer></script><script src="dashboard.js?v=pms1" defer></script></body></html>
